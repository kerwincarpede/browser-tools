name: Release

# Runs when you push a tag made by `npm run release`, e.g. mermaid-lens-v0.2.0.
on:
  push:
    tags: ['*-v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Work out extension and version from the tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^[a-z0-9-]+-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Unexpected tag ${tag}"; exit 1; fi
          name="${tag%-v*}"
          version="${tag##*-v}"
          dir="extensions/${name}"
          if [ ! -f "${dir}/package.json" ]; then echo "::error::No extension at ${dir}"; exit 1; fi
          pkg_version=$(node -p "require('./${dir}/package.json').version")
          if [ "${pkg_version}" != "${version}" ]; then
            echo "::error::Tag says ${version} but ${dir}/package.json says ${pkg_version}"; exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          DIR: ${{ steps.meta.outputs.dir }}
        run: npm run package --workspace "$DIR"

      - name: Release notes from CHANGELOG.md
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIR: ${{ steps.meta.outputs.dir }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' "$DIR/CHANGELOG.md" > notes.md
          printf '\n---\nUpload `%s-%s.zip` to the Chrome Web Store and Microsoft Edge Add-ons. See docs/uploading-to-the-stores.md.\n' \
            "$NAME" "$VERSION" >> notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIR: ${{ steps.meta.outputs.dir }}
        run: |
          zip="$DIR/release/$NAME-$VERSION.zip"
          # `npm run release -- ... --gh-release` may already have published it from a laptop.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "$NAME v$VERSION" \
            --notes-file notes.md
