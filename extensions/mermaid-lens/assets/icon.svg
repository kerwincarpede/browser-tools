<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7178f7"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>
  <!-- viewfinder: the "lens" framing the diagram -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M21 40 V31 a10 10 0 0 1 10 -10 H40"/>
    <path d="M88 21 H97 a10 10 0 0 1 10 10 V40"/>
    <path d="M107 88 V97 a10 10 0 0 1 -10 10 H88"/>
    <path d="M40 107 H31 a10 10 0 0 1 -10 -10 V88"/>
  </g>
  <!-- flowchart: one branch dimmed, one highlighted -->
  <path d="M64 50 V61 H45 V70" stroke="#fff" stroke-opacity="0.45" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g filter="url(#glow)" opacity="0.7">
    <path d="M64 50 V61 H83 V70" stroke="#fbbf24" stroke-width="6" fill="none"/>
    <rect x="69" y="72" width="28" height="16" rx="5.5" fill="#f59e0b"/>
  </g>
  <path d="M64 50 V61 H83 V70" stroke="#fbbf24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="47" y="36" width="34" height="16" rx="5.5" fill="#fff"/>
  <rect x="31" y="72" width="28" height="16" rx="5.5" fill="#fff" fill-opacity="0.6"/>
  <rect x="69" y="72" width="28" height="16" rx="5.5" fill="#fbbf24"/>
</svg>
